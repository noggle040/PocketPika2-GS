name: PocketPika
options:
  bundleIdPrefix: com.noggle040
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: 'YES'
targets:
  PocketPika:
    type: application
    platform: iOS
    sources:
      - path: PocketPika
        excludes:
          - '*.entitlements'
          - MarillGallery
      - path: PocketPika/MarillGallery
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noggle040.pocketmarillgs
        PRODUCT_NAME: PocketPika
        CODE_SIGN_ENTITLEMENTS: PocketPika/PocketPika.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 'Pocket Marril'
        INFOPLIST_KEY_NSHealthShareUsageDescription: 'Pocket Marril uses the steps you permit in Apple Health to award Ice Water for walking.'
        INFOPLIST_KEY_NSMotionUsageDescription: 'Pocket Marril uses iPhone motion steps to power your walking companion.'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        SUPPORTS_MACCATALYST: 'NO'

